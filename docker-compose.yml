services:
  postgres:
    image: postgres:16-alpine
    container_name: amorino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amorino
    ports:
      - "5432:5432"
    volumes:
      - amorino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amorino"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amorino_pgdata:
